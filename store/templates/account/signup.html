{% extends "../base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center">
  <div class="border rounded w-100 mt-4 mb-5 pt-4" style="max-width: 46rem;">
    <h2 class="text-center">Sign Up</h2>

    <div class="px-4 pt-3">
      {% include '../partials/form-errors.html' %}
    </div>

    <form method="post" class="px-4 pb-4" novalidate>
      {% csrf_token %}
      <div class="row">
        {% for field in form %}
        <div class="col-md-6 mb-3">
          {% include '../partials/field.html' with field=field %}
        </div>
        {% endfor %}
      </div>
      <div class="row g-2 p-3 text-center">
        <button class="btn btn-primary" type="submit">Sign Up</button>
        <button class="btn btn-outline-secondary" type="reset">Reset</button>
      </div>
      <p class="text-center text-muted mb-0">
        Already registered? <a href="{% url 'account_login' %}">Log in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
