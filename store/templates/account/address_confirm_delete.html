{% extends "../base.html" %}

{% block title %}Remove address{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center">
    <div class="border rounded w-100 mt-4 mb-5 p-4 text-center" style="max-width: 34rem;">
        <h2 class="mb-3">Remove this address?</h2>
        <p class="text-muted">{{ object }}</p>
        <p class="small text-muted">
            Orders already shipped to it keep it in their history.
        </p>
        <form method="post" class="mt-4">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Yes, remove it</button>
            <a class="btn btn-outline-secondary" href="{% url 'account_profile' %}#Address">Keep it</a>
        </form>
    </div>
</div>
{% endblock %}
