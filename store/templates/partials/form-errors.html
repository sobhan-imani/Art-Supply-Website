{% comment %}
Everything a form wants to say that is not attached to a single field: the
"wrong phone number or password" of a login, or a model validation error.
{% endcomment %}
{% if form.non_field_errors %}
<div class="alert alert-danger d-flex align-items-center" role="alert">
    <i class="bi-exclamation-triangle-fill me-2"></i>
    <div>
        {% for error in form.non_field_errors %}
        <div>{{ error }}</div>
        {% endfor %}
    </div>
</div>
{% endif %}
